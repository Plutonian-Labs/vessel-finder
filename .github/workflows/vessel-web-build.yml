name: Vessel Finder frontend build
on:
  push:
    branches: [feature/vessel-finder-modernization]
    paths:
      - 'web/**'
      - 'js/satellite_geoJSON.js'
      - 'images/markers/**'
      - 'images/icons/ports-icon.png'
      - 'temp/WPIports.csv'
      - '.github/workflows/vessel-web-build.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'js/satellite_geoJSON.js'
      - 'images/markers/**'
      - 'images/icons/ports-icon.png'
      - 'temp/WPIports.csv'
      - '.github/workflows/vessel-web-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: web
        run: npm run build
